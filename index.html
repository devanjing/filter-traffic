<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        /* Neo-Brutalist Minimalist Style */
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .container {
            border: 4px solid #ffffff;
            padding: 2rem;
            box-shadow: 10px 10px 0px #3b82f6; /* Hard blue shadow */
            max-width: 300px;
            text-align: center;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #ffffff;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <h1>Verifying Connection</h1>
    </div>

    <script>
    window.ROUTER_TIER_CONFIG = {
        T1: new Set(["US", "GB", "CA", "AU", "DE", "CH", "NO"]),
        T2: new Set(["SG", "JP", "AE", "FR", "NL", "IE", "ES"]),
        T2: new Set(["ID", "TH", "PH", "VN", "MY", "BR", "MX"])
    };

    window.ROUTER_LINKS = {
        bots: 'https:///bot-trap',
        tier1: '/premium',
        tier2: '/standard',
        tier3: '/basic',
        other: '/default'
    };
    </script>
    <script src="./script.js"></script>
</body>
</html>
